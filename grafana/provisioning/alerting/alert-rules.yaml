apiVersion: 1

# Passt zu eurer bestehenden Provisioning-Struktur (analog zu dashboards.yaml).
# Ablage z.B. unter /etc/grafana/provisioning/alerting/rules.yaml

groups:
  - orgId: 1
    name: "BDLS Anomaly Alerts"
    folder: "Pipeline"
    interval: 35m
    rules:
      - uid: bdls-wind-deviation
        title: "Windpark: RPM-Abweichung über Schwelle"
        condition: C
        for: 5m
        labels:
          severity: warning
          domain: windpark
        annotations:
          summary: "{{ $labels.windpark_id }}: RPM weicht stark vom Erwartungsbereich ab"
          description: "Aktuelle Abweichung: {{ $values.B }} RPM (Schwelle: -10)"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: timescaledb
            model:
              rawSql: >-
                SELECT time AS "time", deviation_rpm AS value
                FROM windpark_estimates
                WHERE $__timeFilter(time)
                ORDER BY time
              format: time_series
              rawQuery: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [-10]
              refId: C

      - uid: bdls-pv-deviation
        title: "PV: Produktions-Abweichung über Schwelle"
        condition: C
        for: 5m
        labels:
          severity: warning
          domain: pv
        annotations:
          summary: "{{ $labels.station_id }}: PV-Produktion weicht stark vom Erwartungsbereich ab"
          description: "Aktuelle Abweichung: {{ $values.B }} W (Schwelle: 500)"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: timescaledb
            model:
              rawSql: >-
                SELECT time AS "time", deviation_w AS value
                FROM pv_estimates
                WHERE $__timeFilter(time)
                ORDER BY time
              format: time_series
              rawQuery: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [500]
              refId: C

contactPoints:
  - orgId: 1
    name: "pipeline-notifications"
    receivers:
      - uid: pipeline-webhook
        type: webhook
        settings:
          url: "https://webhook.site/76681814-eec0-4871-b864-fdd02f8ae788"   # <-- Default anpassen
          httpMethod: POST
          # Optional, falls euer Endpunkt Basic Auth erwartet:
          # username: "grafana"
          # password: "geheim"          # wird verschlüsselt in Grafana gespeichert
          # Optional, falls ein Bearer-Token/Secret-Header nötig ist:
          # authorization_scheme: Bearer
          # authorization_credentials: "euer-token"
        disableResolveMessage: false   # false = ihr bekommt auch eine Meldung, wenn der Alert wieder OK ist

policies:
  - orgId: 1
    receiver: pipeline-notifications
    group_by: ["alertname"]
    routes:
      - receiver: pipeline-notifications
        object_matchers:
          - ["domain", "=", "windpark"]
      - receiver: pipeline-notifications
        object_matchers:
          - ["domain", "=", "pv"]