apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: false
    editable: true

  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: pipeline_db
    user: pipeline
    isDefault: true
    editable: true
    secureJsonData:
      password: pipeline
    jsonData:
      sslmode: "disable"
      postgresVersion: 1600
      timescaledb: true
